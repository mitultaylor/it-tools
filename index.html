<head>
<meta charset="UTF-8" />

<meta name="description" content="Six precision browser tools for IT leaders. Built on 12 years of IT operations." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --sky: #b8d4e8;
  --ink: #0a0a0a;
  --ink-60: rgba(10, 10, 10, 0.6);
  --ink-40: rgba(10, 10, 10, 0.4);
  --accent: #ff4d00;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: 'Archivo', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
::selection { background: var(--ink); color: var(--sky); }

.stage { position: fixed; inset: 0; overflow: hidden; }

/* ── Water ripple canvas ──────────────────────────────────── */
.ripple {
  position: absolute; inset: 0; z-index: 0;
  width: 100vw; height: 100vh;
  display: block;
}

/* ── Topbar / footer ──────────────────────────────────────── */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  padding: 26px 40px;
}
.brand { font: 700 13px 'Archivo'; letter-spacing: 0.22em; }
.topbar-meta { font: 500 11px 'Archivo'; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-60); }
.foot {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between;
  padding: 22px 40px;
  font: 500 11px 'Archivo'; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-40);
}

/* ── Headline ─────────────────────────────────────────────── */
.headline {
  position: absolute; z-index: 2; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  text-align: center; pointer-events: none;
}
.overline {
  font: 600 11px 'Archivo'; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--ink-60); margin-bottom: 22px;
}
.hero-title {
  font: 400 clamp(72px, 12.5vw, 200px)/0.92 'Anton', sans-serif;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.hero-title .accent { color: var(--accent); }

/* ── Scattered floating pill cards ────────────────────────── */
.cards { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.par {
  position: absolute; pointer-events: auto;
  transform: translate3d(calc(var(--px, 0) * var(--d)), calc(var(--py, 0) * var(--d)), 0);
}
.par-1 { top: 11%; left: 5%; }
.par-2 { top: 8%; right: 7%; }
.par-3 { top: 42%; left: 2.5%; }
.par-4 { top: 38%; right: 3%; }
.par-5 { bottom: 12%; left: 11%; }
.par-6 { bottom: 9%; right: 12%; }

@keyframes floatY {
  0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
  50% { transform: translateY(-11px) rotate(var(--rot, 0deg)); }
}
.float { animation: floatY 6s ease-in-out infinite; }
.f-1 { animation-duration: 5.6s; }
.f-2 { animation-duration: 6.8s; animation-delay: 0.7s; }
.f-3 { animation-duration: 7.6s; animation-delay: 1.3s; }
.par-1 .float { --rot: -3.5deg; }
.par-2 .float { --rot: 2.5deg; }
.par-3 .float { --rot: 2deg; }
.par-4 .float { --rot: -2.5deg; }
.par-5 .float { --rot: 1.5deg; }
.par-6 .float { --rot: -2deg; }

.pcard {
  display: flex; align-items: center; gap: 13px;
  padding: 9px 9px 9px 10px;
  border-radius: 999px;
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.55));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.85);
  box-shadow:
    0 24px 50px rgba(30, 60, 90, 0.2),
    0 4px 12px rgba(30, 60, 90, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.95);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
}
.pcard:hover {
  transform: translateY(-9px) scale(1.03);
  box-shadow:
    0 38px 70px rgba(30, 60, 90, 0.28),
    0 8px 18px rgba(30, 60, 90, 0.12),
    inset 0 1px 0 rgba(255, 255, 255, 1);
}
.pcard-icon {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--ink); color: var(--sky);
}
.pcard-icon svg { width: 17px; height: 17px; }
.pcard-name {
  font: 600 14px 'Archivo'; letter-spacing: -0.01em; color: var(--ink);
  max-width: 170px; line-height: 1.25;
}
.pcard-buy {
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  background: var(--ink); color: #fff;
  text-decoration: none; font: 700 13px 'Archivo';
  padding: 12px 17px; border-radius: 999px;
  transition: background-color 0.25s, transform 0.25s;
}
.pcard-buy svg { width: 13px; height: 13px; }
.pcard-buy:hover { background: var(--accent); transform: scale(1.05); }
.pcard-buy:active { transform: scale(0.96); }

/* ── Small screens: stacked, scrollable ───────────────────── */
@media (max-width: 900px) {
  body { overflow: auto; }
  .stage { position: static; overflow: visible; min-height: 100vh; padding: 96px 22px 90px; }
  .ripple { position: fixed; }
  .topbar { position: fixed; padding: 18px 22px; background: rgba(184, 212, 232, 0.85); backdrop-filter: blur(10px); }
  .headline { position: static; transform: none; text-align: left; margin-bottom: 44px; pointer-events: auto; }
  .hero-title { font-size: clamp(58px, 16vw, 96px); }
  .cards { position: static; display: flex; flex-direction: column; gap: 14px; pointer-events: auto; }
  .par { position: static; transform: none; }
  .float { animation: none; }
  .pcard { width: 100%; }
  .pcard-name { max-width: none; flex: 1; }
  .foot { position: fixed; padding: 16px 22px; }
}
</style>

<script>
(function () {
  /* ── Water ripple simulation ─────────────────────────────── */
  var canvas = document.getElementById("ripple");
  var ctx = canvas.getContext("2d");
  var SCALE = 3;
  var W = 0, H = 0, buf1, buf2, img, raf, rowBase;
  var TOP = [206, 227, 241];
  var BOT = [166, 197, 222];

  function resize() {
    W = Math.ceil(window.innerWidth / SCALE);
    H = Math.ceil(window.innerHeight / SCALE);
    canvas.width = W;
    canvas.height = H;
    buf1 = new Float32Array(W * H);
    buf2 = new Float32Array(W * H);
    img = ctx.createImageData(W, H);
    rowBase = new Float32Array(H * 3);
    for (var y = 0; y < H; y++) {
      var t = y / H;
      for (var c = 0; c < 3; c++) rowBase[y * 3 + c] = TOP[c] + (BOT[c] - TOP[c]) * t;
    }
  }

  function drop(x, y, s) {
    var bx = Math.floor(x / SCALE), by = Math.floor(y / SCALE);
    for (var j = -2; j <= 2; j++) {
      for (var i = -2; i <= 2; i++) {
        var xi = bx + i, yj = by + j;
        if (xi > 0 && xi < W - 1 && yj > 0 && yj < H - 1) buf1[yj * W + xi] += s;
      }
    }
  }

  function step() {
    var x, y, i, p, sh;
    for (y = 1; y < H - 1; y++) {
      var row = y * W;
      for (x = 1; x < W - 1; x++) {
        i = row + x;
        buf2[i] = ((buf1[i - 1] + buf1[i + 1] + buf1[i - W] + buf1[i + W]) * 0.5 - buf2[i]) * 0.982;
      }
    }
    var tmp = buf1; buf1 = buf2; buf2 = tmp;
    var d = img.data;
    for (y = 0; y < H; y++) {
      var r2 = y * W, rb = y * 3;
      for (x = 0; x < W; x++) {
        i = r2 + x; p = i * 4;
        sh = buf1[i] * 0.9;
        d[p] = Math.max(0, Math.min(255, rowBase[rb] + sh));
        d[p + 1] = Math.max(0, Math.min(255, rowBase[rb + 1] + sh));
        d[p + 2] = Math.max(0, Math.min(255, rowBase[rb + 2] + sh * 0.6));
        d[p + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    raf = requestAnimationFrame(step);
  }

  var last = 0;
  window.addEventListener("mousemove", function (e) {
    var now = performance.now();
    if (now - last > 28) { drop(e.clientX, e.clientY, 240); last = now; }
  });
  window.addEventListener("touchmove", function (e) {
    var t = e.touches[0];
    if (t) drop(t.clientX, t.clientY, 240);
  }, { passive: true });
  setInterval(function () {
    drop(Math.random() * window.innerWidth, Math.random() * window.innerHeight, 150);
  }, 1500);
  window.addEventListener("resize", resize);
  resize();
  step();

  /* ── Mouse parallax for scattered cards ──────────────────── */
  var root = document.documentElement;
  var tx = 0, ty = 0, cx = 0, cy = 0;
  window.addEventListener("mousemove", function (e) {
    tx = (e.clientX / window.innerWidth - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  (function loop() {
    cx += (tx - cx) * 0.055;
    cy += (ty - cy) * 0.055;
    root.style.setProperty("--px", cx.toFixed(4));
    root.style.setProperty("--py", cy.toFixed(4));
    requestAnimationFrame(loop);
  })();
})();
</script>
